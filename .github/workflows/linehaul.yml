name: 🚚 Kéo Linehaul Trips

on:
  workflow_dispatch: # Bấm chạy thủ công
  schedule:
    - cron: '4 23 * * *'  # Chạy lúc 06:04 giờ Việt Nam
    - cron: '14 6 * * *'   # Chạy lúc 13:14 giờ Việt Nam
    - cron: '7 15 * * *'   # Chạy lúc 22:07 giờ Việt Nam

jobs:
  run-linehaul:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install-deps chromium
          playwright install chromium

      - name: Run Linehaul Script
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: python linehaul.py
