name: Auto Extract SPX Cookie

on:
  schedule:
    - cron: '13 18 * * *' # Kích hoạt lúc ~01:13 sáng (Giờ VN)
    - cron: '37 21 * * *' # Kích hoạt lúc ~04:37 sáng (Giờ VN)
    - cron: '04 0 * * *'  # Kích hoạt lúc ~07:04 sáng (Giờ VN)
    - cron: '52 3 * * *'  # Kích hoạt lúc ~10:52 sáng (Giờ VN)
    - cron: '23 6 * * *'  # Kích hoạt lúc ~13:23 chiều (Giờ VN)
    - cron: '48 9 * * *'  # Kích hoạt lúc ~16:48 chiều (Giờ VN)
    - cron: '19 12 * * *' # Kích hoạt lúc ~19:19 tối (Giờ VN)
    - cron: '57 15 * * *' # Kích hoạt lúc ~22:57 tối (Giờ VN)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    # Cấp quyền ghi để tool keepalive có thể tạo commit chống đóng băng workflow
    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Bước xử lý lỗi mạng DNS kho Ubuntu của GitHub
      - name: Xử lý lỗi mạng DNS kho Ubuntu
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list 2>/dev/null || true
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo apt-get update

      - name: Install Python dependencies & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          playwright install chromium --with-deps

      - name: Execute Python script (Auto Retry on Failure)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 180
          command: python main.py
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SHEET_URL: ${{ secrets.SHEET_URL }}

      # Bước tự động tạo hoạt động để GitHub không vô hiệu hóa workflow sau 60 ngày
      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2
