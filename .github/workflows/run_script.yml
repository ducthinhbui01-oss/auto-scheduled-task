name: Auto Extract SPX Cookie

on:
  schedule:
    # Tự động chạy lấy Cookie vào 08:00 sáng giờ Việt Nam hàng ngày (01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch: # Cho phép bấm Run workflow chạy ngay lập tức

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Python dependencies & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          playwright install chromium --with-deps

      - name: Execute Python script
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: python main.py
