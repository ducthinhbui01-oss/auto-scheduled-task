name: Auto Extract SPX Cookie

on:
  schedule:
    # Tự động chạy mỗi 3 tiếng vào phút thứ 17
    - cron: '17 */3 * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" để chạy thủ công

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          playwright install chromium --with-deps

      - name: Execute Python script (Auto Retry on Failure)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 180
          command: python main.py
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
